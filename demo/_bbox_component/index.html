<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fafafa; font-family: sans-serif; overflow: hidden; }
  #toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px;
    background: #f0f0f0;
    border-bottom: 1px solid #ddd;
  }
  button {
    background: #555; color: #fff; border: none; border-radius: 4px;
    padding: 3px 10px; cursor: pointer; font-size: 12px;
  }
  button:hover { background: #333; }
  #count { font-size: 12px; color: #555; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>

<div id="toolbar">
  <button onclick="undoLast()">↩ Undo</button>
  <button onclick="clearAll()">🗑 Clear</button>
  <span id="count">0 box(es) drawn</span>
</div>
<canvas id="c"></canvas>

<script>
// Minimal Streamlit component protocol (inline, no CDN needed)
const Streamlit = (() => {
  const RENDER_EVENT = 'streamlit:render';
  const ev = new EventTarget();

  function send(msg) { window.parent.postMessage(msg, '*'); }
  function setComponentReady() { send({ type: 'streamlit:componentReady', apiVersion: 1 }); }
  function setComponentValue(value) { send({ type: 'streamlit:setComponentValue', value, dataType: 'json' }); }
  function setFrameHeight(h) { send({ type: 'streamlit:setFrameHeight', height: h }); }

  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'streamlit:render') {
      ev.dispatchEvent(new CustomEvent(RENDER_EVENT, { detail: e.data }));
    }
  });

  return { RENDER_EVENT, events: ev, setComponentReady, setComponentValue, setFrameHeight };
})();

// ----- Canvas state -----
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const img    = new Image();

let boxes   = [];
let drawing = false;
let sx = 0, sy = 0;
let W = 700, H = 500;
let initialized = false;

// ----- Draw -----
function redraw() {
  ctx.clearRect(0, 0, W, H);
  if (img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, 0, 0, W, H);
  }
  boxes.forEach((b, i) => {
    ctx.strokeStyle = '#2ca02c';
    ctx.lineWidth   = 3;
    ctx.fillStyle   = 'rgba(44,160,44,0.20)';
    ctx.fillRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
    ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
    // label tag
    const lbl = '#' + (i + 1);
    const tagW = lbl.length * 9 + 6;
    const tagY = Math.max(0, b.y1 - 18);
    ctx.fillStyle = '#2ca02c';
    ctx.fillRect(b.x1, tagY, tagW, 18);
    ctx.fillStyle = 'white';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText(lbl, b.x1 + 3, tagY + 13);
  });
  document.getElementById('count').textContent = boxes.length + ' box(es) drawn';
}

// ----- Mouse -----
function getXY(e) {
  const r = canvas.getBoundingClientRect();
  return [Math.round(e.clientX - r.left), Math.round(e.clientY - r.top)];
}

canvas.addEventListener('mousedown', e => { [sx, sy] = getXY(e); drawing = true; });

canvas.addEventListener('mousemove', e => {
  if (!drawing) return;
  const [cx, cy] = getXY(e);
  redraw();
  ctx.setLineDash([5, 3]);
  ctx.strokeStyle = '#2ca02c';
  ctx.lineWidth = 2;
  ctx.strokeRect(sx, sy, cx - sx, cy - sy);
  ctx.setLineDash([]);
});

canvas.addEventListener('mouseup', e => {
  if (!drawing) return;
  drawing = false;
  const [ex, ey] = getXY(e);
  if (Math.abs(ex - sx) > 8 && Math.abs(ey - sy) > 8) {
    boxes.push({
      x1: Math.min(sx, ex), y1: Math.min(sy, ey),
      x2: Math.max(sx, ex), y2: Math.max(sy, ey)
    });
    Streamlit.setComponentValue(boxes);
  }
  redraw();
});

// ----- Toolbar -----
function undoLast() {
  if (boxes.length > 0) { boxes.pop(); redraw(); Streamlit.setComponentValue(boxes); }
}
function clearAll() {
  boxes = []; redraw(); Streamlit.setComponentValue(boxes);
}

// ----- Streamlit render event -----
Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, event => {
  const args = event.detail.args || {};
  W = args.width  || 700;
  H = args.height || 500;

  canvas.width  = W;
  canvas.height = H;

  // Load image from base64 only when it changes
  const newSrc = 'data:image/png;base64,' + (args.image_b64 || '');
  if (img.src !== newSrc) {
    img.onload = () => {
      // Only set initial boxes the very first time
      if (!initialized) {
        boxes = args.initial_boxes || [];
        initialized = true;
      }
      redraw();
      Streamlit.setFrameHeight(H + 36);
    };
    img.src = newSrc;
  } else {
    // Image already loaded — just update initial_boxes if not yet initialized
    if (!initialized) {
      boxes = args.initial_boxes || [];
      initialized = true;
    }
    redraw();
    Streamlit.setFrameHeight(H + 36);
  }
});

Streamlit.setComponentReady();
</script>
</body>
</html>
